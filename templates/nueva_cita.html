<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Nueva cita</h1>
        <div class="card p-4 shadow-sm">
            <form method="POST" action="{{ url_for('nueva_cita') }}">
                <div class="mb-3">
                    <label for="paciente" class="form-label">Paciente *</label>
                    <select name="paciente" id="paciente" class="form-select" required>
                        <option value="">Selecciona un paciente</option>
                        {% for paciente in pacientes %}
                            <option value="{{ paciente.id }}">{{ paciente.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="atendido_por" class="form-label">Alumno *</label>
                    <select name="atendido_por" id="atendido_por" class="form-select" required>
                        {% for doctor in doctores %}
                            <option value="{{ doctor }}">{{ doctor }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fecha" class="form-label">Fecha *</label>
                        <input type="date" name="fecha" id="fecha" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="horario" class="form-label">Inicio *</label>
                        <input type="time" name="horario" id="horario" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="fin" class="form-label">Fin *</label>
                        <input type="time" name="fin" id="fin" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="procedimiento" class="form-label">Procedimiento</label>
                    <input type="text" name="procedimiento" id="procedimiento" class="form-control" placeholder="Ej. Endodoncia, restauración, valoración...">
                </div>

                <div class="mb-3">
                    <label for="notas" class="form-label">Notas</label>
                    <textarea name="notas" id="notas" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">Agendar cita</button>
            </form>
        </div>
    </div>
</body>
</html>
