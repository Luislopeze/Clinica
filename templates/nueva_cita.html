{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold">Agendar nueva cita</h3>

<div class="card shadow-sm p-4">
    <form method="post">

        <!-- Paciente -->
        <div class="mb-3">
            <label class="fw-bold">Paciente *</label>
            <select name="paciente" class="form-control" required>
                {% for p in pacientes %}
                <option value="{{ p }}">{{ p }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Clínica y horario -->
        <div class="mb-3">
            <label class="fw-bold">Selecciona clínica y horario *</label>
            <select name="clinica" class="form-control mb-2" required>
                <option value="Clínica Integral">Clínica Integral</option>
                <option value="Prótesis Total">Prótesis Total</option>
                <option value="Prótesis Removible">Prótesis Removible</option>
            </select>

            <select name="horario" class="form-control" required>
                <option value="Lunes 12:00-14:00 Prótesis Removible">Lunes 12pm-2pm - Prótesis Removible</option>
                <option value="Lunes 16:00-18:00 Clínica Integral">Lunes 4pm-6pm - Clínica Integral</option>
                <option value="Martes 16:00-18:00 Clínica Integral">Martes 4pm-6pm - Clínica Integral</option>
                <option value="Miércoles 10:00-12:00 Clínica Integral">Miércoles 10am-12pm - Clínica Integral</option>
                <option value="Miércoles 12:00-14:00 Prótesis Removible">Miércoles 12pm-2pm - Prótesis Removible</option>
                <option value="Miércoles 16:00-18:00 Prótesis Total">Miércoles 4pm-6pm - Prótesis Total</option>
                <option value="Jueves 16:00-18:00 Clínica Integral">Jueves 4pm-6pm - Clínica Integral</option>
                <option value="Viernes 10:00-12:00 Clínica Integral">Viernes 10am-12pm - Clínica Integral</option>
                <option value="Viernes 12:00-14:00 Prótesis Total">Viernes 12pm-2pm - Prótesis Total</option>
            </select>
        </div>

        <!-- Fecha -->
        <div class="mb-3">
            <label class="fw-bold">Fecha *</label>
            <input type="date" name="fecha" class="form-control" required>
        </div>

        <!-- Alumno / Atendido por -->
        <div class="mb-3">
            <label class="fw-bold">Atendido por *</label>
            <input type="text" name="atendido_por" class="form-control" placeholder="Nombre del alumno" required>
        </div>

        <!-- Notas -->
        <div class="mb-3">
            <label class="fw-bold">Notas</label>
            <textarea name="notas" class="form-control" rows="3"></textarea>
        </div>

        <button class="btn btn-primary w-100">Guardar cita</button>
    </form>
</div>
{% endblock %}
