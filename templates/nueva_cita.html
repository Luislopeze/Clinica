{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold">Nueva cita</h3>

<div class="card shadow-sm p-4">
    <form>
        <div class="mb-3">
            <label class="fw-bold">Paciente *</label>
            <select class="form-select">
                <option selected>Selecciona un paciente</option>
                {% for p in pacientes %}
                <option>{{ p }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="fw-bold">Alumno *</label>
            <select class="form-select">
                {% for a in alumnos %}
                <option>{{ a }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="fw-bold">Fecha *</label>
                <input type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="fw-bold">Inicio *</label>
                <input type="time" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="fw-bold">Fin *</label>
                <input type="time" class="form-control">
            </div>
        </div>

        <div class="mb-3">
            <label class="fw-bold">Procedimiento</label>
            <input type="text" class="form-control" placeholder="Ej. Endodoncia, restauración, valoración...">
        </div>

        <div class="mb-3">
            <label class="fw-bold">Notas</label>
            <textarea class="form-control" rows="3"></textarea>
        </div>

        <button class="btn btn-primary w-100">Agendar cita</button>
    </form>
</div>
{% endblock %}
