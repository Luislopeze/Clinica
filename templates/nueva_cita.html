<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Nueva Cita</title>
</head>
<body>
    <h1>Registrar nueva cita</h1>

    <form method="POST" action="{{ url_for('nueva_cita') }}">
        <!-- Paciente -->
        <label for="paciente">Paciente:</label>
        <select name="paciente" id="paciente" required>
            {% for paciente in pacientes %}
                <option value="{{ paciente.id }}">{{ paciente.nombre }}</option>
            {% endfor %}
        </select>
        <br><br>

        <!-- Clínica -->
        <label for="clinica">Clínica:</label>
        <select name="clinica" id="clinica" required>
            {% for clinica in clinicas %}
                <option value="{{ clinica }}">{{ clinica }}</option>
            {% endfor %}
        </select>
        <br><br>

        <!-- Fecha -->
        <label for="fecha">Fecha:</label>
        <input type="date" name="fecha" id="fecha" required>
        <br><br>

        <!-- Horario -->
        <label for="horario">Horario:</label>
        <input type="time" name="horario" id="horario" required>
        <br><br>

        <!-- Atendido por -->
        <label for="atendido_por">Atendido por:</label>
        <select name="atendido_por" id="atendido_por" required>
            {% for doctor in doctores %}
                <option value="{{ doctor }}">{{ doctor }}</option>
            {% endfor %}
        </select>
        <br><br>

        <!-- Notas -->
        <label for="notas">Notas:</label>
        <textarea name="notas" id="notas"></textarea>
        <br><br>

        <button type="submit">Guardar cita</button>
    </form>

    <br>
    <a href="{{ url_for('agenda') }}">Volver a la agenda</a>
</body>
</html>
