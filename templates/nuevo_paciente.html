<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Nuevo Paciente</title>
</head>
<body>
    <h1>Registrar nuevo paciente</h1>

    <form method="POST" action="{{ url_for('nuevo_paciente') }}">
        <!-- Folio -->
        <label for="folio">Folio:</label>
        <input type="text" name="folio" id="folio" required>
        <br><br>

        <!-- Nombre -->
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre" required>
        <br><br>

        <!-- Teléfono -->
        <label for="telefono">Teléfono:</label>
        <input type="text" name="telefono" id="telefono">
        <br><br>

        <!-- Fecha de nacimiento -->
        <label for="nacimiento">Fecha de nacimiento:</label>
        <input type="date" name="nacimiento" id="nacimiento" required>
        <br><br>

        <!-- Notas -->
        <label for="notas">Notas:</label>
        <textarea name="notas" id="notas"></textarea>
        <br><br>

        <button type="submit">Guardar paciente</button>
    </form>

    <br>
    <a href="{{ url_for('pacientes_view') }}">Volver a la lista de pacientes</a> |
    <a href="{{ url_for('dashboard') }}">Volver al dashboard</a>
</body>
</html>
