<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clínica Odontológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🦷 Clínica Odontológica</a>
            <div class="ms-auto">
                <a href="/historial" class="btn btn-outline-secondary me-2">Historial</a>
                <a href="/" class="btn btn-outline-secondary me-2">Inicio</a>
                <a href="/agenda" class="btn btn-outline-secondary me-2">Agenda</a>
                <a href="/pacientes" class="btn btn-outline-secondary me-2">Pacientes</a>
                <a href="/nueva_cita" class="btn btn-primary">+ Nueva cita</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-warning">
              {% for msg in messages %}
                {{ msg }}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
