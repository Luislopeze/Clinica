{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold">Agenda</h3>

<!-- Barra superior -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <form method="GET" action="{{ url_for('agenda') }}" class="flex-grow-1 me-2">
        <input type="text" name="buscar" class="form-control" placeholder="Buscar cita...">
    </form>
    <a href="{{ url_for('nueva_cita') }}" class="btn btn-primary">+ Nueva cita</a>
</div>

<!-- Calendario -->
<div id="calendar" class="shadow-sm p-3 bg-white rounded"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: ''
        },
        events: [
            {% for cita in citas %}
            {
                title: '{{ cita.paciente.nombre }} - {{ cita.procedimiento }}',
                start: '{{ cita.fecha.strftime("%Y-%m-%d") }}T{{ cita.inicio.strftime("%H:%M:%S") }}',
                end: '{{ cita.fecha.strftime("%Y-%m-%d") }}T{{ cita.fin.strftime("%H:%M:%S") }}',
                color: '#0d6efd'
            },
            {% endfor %}
        ]
    });
    calendar.render();
});
</script>

<!-- Librerías de FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
{% endblock %}
