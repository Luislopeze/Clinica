{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold">Agenda compartida</h3>
<p>Luis y Angie</p>

<div class="d-flex align-items-center mb-3">
    <label class="me-2 fw-bold">Fecha</label>
    <input type="date" class="form-control w-auto" value="{{ hoy }}">
    <button class="btn btn-secondary ms-2">Ver día</button>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="fw-bold">Luis</h5>
                <p class="text-muted">Sin citas este día.</p>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-3">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="fw-bold">Angie</h5>
                <p class="text-muted">Sin citas este día.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
