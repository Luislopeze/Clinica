{% extends "base.html" %}
{% block content %}
<h3 class="fw-bold">Agenda</h3>

{% if citas %}
<table class="table table-striped shadow-sm">
    <thead class="table-light">
        <tr>
            <th>Paciente</th>
            <th>Clínica</th>
            <th>Horario</th>
            <th>Notas</th>
        </tr>
    </thead>
    <tbody>
        {% for c in citas %}
        <tr>
            <td>{{ c.paciente }}</td>
            <td>{{ c.clinica }}</td>
            <td>{{ c.horario }}</td>
            <td>{{ c.notas }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="text-muted">No hay citas registradas.</p>
{% endif %}
{% endblock %}
